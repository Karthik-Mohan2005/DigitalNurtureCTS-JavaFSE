<h2>Student Enrollment Form</h2>

<form
#enrollForm="ngForm"

(ngSubmit)="onSubmit(enrollForm)">

    <label>Student Name</label>

    <br>

    <input

    type="text"

    name="studentName"

    ngModel

    required

    minlength="3"

    #nameCtrl="ngModel">

    <br><br>

    <label>Email</label>

    <br>

    <input

    type="email"

    name="studentEmail"

    ngModel

    required

    email

    #emailCtrl="ngModel">

    <br><br>

    <label>Course ID</label>

    <br>

    <input

    type="number"

    name="courseId"

    ngModel

    required

    #courseCtrl="ngModel">

    <br><br>

    <label>Preferred Semester</label>

    <br>

    <select

    name="preferredSemester"

    ngModel>

        <option value="Odd">Odd</option>

        <option value="Even">Even</option>

    </select>

    <br><br>

    <input

    type="checkbox"

    name="agreeToTerms"

    ngModel

    required

    #termsCtrl="ngModel">

    I Agree

    <br><br>

    <button

    type="submit"

    [disabled]="enrollForm.invalid">

    Submit

    </button>

</form>
